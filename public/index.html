<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Coverage Navigator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css"></head><body>
<div class="banner">Demo with sample policy, mock providers and simulated prices. Not real Generali Tranquilidade or AdvanceCare data.</div>
<header><div class="brand"><span class="logo">+</span><div><b>Coverage Navigator</b><small>Provided by your insurance broker</small></div></div>
<nav id="nav"><a data-k="home">Check a treatment</a><a data-k="plan">My plan</a></nav>
<button class="btn ghost" id="talk">Talk to my broker</button></header>
<main id="main"></main>
<button class="fab" id="fab">Ask a question</button>
<aside id="chat" hidden><div class="ch"><b>Ask about your plan</b><button id="x" aria-label="Close">×</button></div>
<div class="chat" id="log"></div><div class="sugg" id="sugg"></div>
<div class="row"><input id="in" placeholder="Type your question"><button class="btn" id="send">Send</button></div></aside>
<div id="modal" class="modal" hidden><div class="box"><h3>Talk to my broker</h3><p>Leave your details and your broker will contact you.</p>
<input id="cn" placeholder="Your name"><input id="cc" placeholder="Phone or email"><textarea id="cm" placeholder="What do you need help with? (optional)"></textarea>
<div class="row"><button class="btn" id="cs">Send request</button><button class="btn ghost" id="cx">Cancel</button></div><p id="cmsg"></p></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
